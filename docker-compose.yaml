services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/app.db
      PORT: "8000"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENDPOINT_URL: ${AI_ENDPOINT_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
