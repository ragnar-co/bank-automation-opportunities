services:
  web:
    build: .
    # No host port binding here: on a shared Coolify host, Coolify's Traefik proxy
    # reaches this container directly over the internal `coolify` network using the
    # port exposed below — publishing a fixed host port risks colliding with other
    # apps (or Coolify's own dashboard) already bound to that port on the host.
    # Local development gets localhost:8000 via docker-compose.override.yml instead.
    expose:
      - "8000"
    environment:
      DATABASE_PATH: /data/app.db
      PORT: "8000"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENDPOINT_URL: ${AI_ENDPOINT_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
